<p>#include &ltstdio.h&gt<br>

int cube(int n)<br>
{<br>
    return n * n * n;<br>
}<br>

void main()<br>
{<br>
    int num, ans;<br>

    printf("Enter a number: ");<br>
    scanf("%d", &num);<br>

    ans = cube(num);<br>

    printf("Cube = %d", ans);<br>

}</p>

<p>Enter a number: 5<br>
Cube = 125</p>
