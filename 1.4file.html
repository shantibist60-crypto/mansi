<p>#include &ltstdio.h&gt</p>

<p>void main()<br> {</p>
   <p> int a = 5;</p>

   <p> printf("Value before decrement = %d\n", a);</p>
   <p> printf("Value during post-decrement = %d\n",a--);</p>
   <p>printf("Value after decrement = %d\n", a);</p>

    <p>}</p>
<h1>Output</h1>
<p>Value before decrement = 5</p>
<p>Value during post-decrement = 5</p>
<p>Value after post-decrement=4</p>
